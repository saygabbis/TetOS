name: "Backup VPS (encerra a TetOS)"

on:
  workflow_dispatch:
    inputs:
      message:
        description: "⚠️ ENCERRA a TetOS, faz backup na main e DEIXA ENCERRADA (não reinicia). Mensagem opcional do commit."
        required: false
        default: ""

concurrency:
  group: backup-vps
  cancel-in-progress: false

jobs:
  backup:
    name: "Backup VPS — TetOS fica encerrada"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "⚠️ Aviso — aplicação será encerrada"
        run: |
          echo "::warning title=TetOS será encerrada::Este workflow ENCERRA o runner WhatsApp na VPS, faz backup de data/ na main e NÃO reinicia a aplicação. Suba de novo manualmente (screen) ou rode o workflow CI/CD."

      - name: Encerrar TetOS, backup e push na main
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            bash scripts/backup-vps.sh "${{ inputs.message }}"
